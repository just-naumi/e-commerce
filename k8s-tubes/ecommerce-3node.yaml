# ==========================================
# 1. STORAGE UNTUK UPLOAD FOTO (Backend)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ==========================================
# 2. STORAGE UNTUK DATA MYSQL (BARU!)
#    Tanpa ini, semua data hilang saat pod restart
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ==========================================
# 3. INIT SQL SEBAGAI CONFIGMAP (BARU!)
#    MySQL akan otomatis run .sql di /docker-entrypoint-initdb.d/
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS ecommerce_db;
    USE ecommerce_db;

    CREATE TABLE IF NOT EXISTS users (
        id       INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50)  UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        role     ENUM('penjual', 'pembeli') NOT NULL
    );

    CREATE TABLE IF NOT EXISTS products (
        id          INT AUTO_INCREMENT PRIMARY KEY,
        nama_barang VARCHAR(100) NOT NULL,
        harga       INT          NOT NULL,
        stok        INT          NOT NULL DEFAULT 0,
        foto_barang VARCHAR(255) NOT NULL DEFAULT '',
        foto_base64 LONGTEXT,
        kategori    VARCHAR(50)  NOT NULL DEFAULT 'Lainnya',
        deskripsi   TEXT,
        penjual_id  INT,
        created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (penjual_id) REFERENCES users(id) ON DELETE CASCADE
    );

    ALTER TABLE products ADD COLUMN IF NOT EXISTS foto_base64 LONGTEXT AFTER foto_barang;
    ALTER TABLE products ADD COLUMN IF NOT EXISTS kategori   VARCHAR(50)  NOT NULL DEFAULT 'Lainnya' AFTER foto_base64;
    ALTER TABLE products ADD COLUMN IF NOT EXISTS deskripsi  TEXT AFTER kategori;
    ALTER TABLE products ADD COLUMN IF NOT EXISTS created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP AFTER penjual_id;

    INSERT IGNORE INTO users (username, password, role) VALUES
    ('Naufal',      'password123', 'penjual'),
    ('Ruth',        'password123', 'pembeli'),
    ('toko_naumi',  'password123', 'penjual'),
    ('buyer_mpay1', 'password123', 'pembeli');

    INSERT IGNORE INTO products (nama_barang, harga, stok, foto_barang, kategori, penjual_id) VALUES
    ('Sepatu Sneakers Putih',  250000, 45, '', 'Fashion',    1),
    ('Kemeja Casual Pria',     150000, 30, '', 'Fashion',    1),
    ('Earphone Bluetooth',     180000, 20, '', 'Elektronik', 1),
    ('Power Bank 10000mAh',    220000, 15, '', 'Elektronik', 1),
    ('Tas Ransel Laptop',      320000, 25, '', 'Fashion',    1),
    ('Minyak Goreng 2L',        32000, 80, '', 'Makanan',    1),
    ('Sabun Mandi Cair',        45000, 60, '', 'Kecantikan', 1),
    ('Dumbbell 5kg',           120000,  8, '', 'Olahraga',   1);
---
# ==========================================
# 4. DATABASE (Berjalan di Node Database)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      nodeSelector:
        node-role.kubernetes.io/database: worker
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "passwordtubes"
        - name: MYSQL_DATABASE
          value: "ecommerce_db"
        ports:
        - containerPort: 3306
        volumeMounts:
        # Data MySQL — tanpa ini semua data hilang saat pod restart
        - mountPath: "/var/lib/mysql"
          name: mysql-data
        # Init SQL — dijalankan otomatis oleh MySQL saat pertama kali start
        - mountPath: "/docker-entrypoint-initdb.d"
          name: db-init
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data-pvc
      - name: db-init
        configMap:
          name: db-init-script
---
# ==========================================
# 5. BACKEND API (Berjalan di Node Backend)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        node-role.kubernetes.io/backend: worker
      containers:
      - name: backend-app
        image: mnaufalhazmi/be-ecommerce:latest   # ganti v1 → latest agar pull image terbaru
        imagePullPolicy: Always                     # selalu pull image terbaru
        resources:
          requests:
            cpu: "100m"
        env:
        - name: DB_HOST
          value: "database-service"
        - name: DB_USER
          value: "root"
        - name: DB_PASS
          value: "passwordtubes"
        - name: DB_NAME
          value: "ecommerce_db"
        volumeMounts:
        - mountPath: "/var/www/html/uploads"
          name: uploads-volume
        ports:
        - containerPort: 80
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: uploads-pvc
---
# ==========================================
# 6. FRONTEND UI (Berjalan di Node Frontend)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        node-role.kubernetes.io/frontend: worker
      containers:
      - name: frontend-app
        image: mnaufalhazmi/fe-ecommerce:latest   # ganti v1 → latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
        env:
        # Pakai internal Kubernetes service name (lebih stabil, tidak bergantung IP publik)
        - name: BACKEND_URL
          value: "http://backend-service/api.php"
        ports:
        - containerPort: 80
---
# ==========================================
# 7. AUTO-SCALING HPA UNTUK FLASH SALE
# ==========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
